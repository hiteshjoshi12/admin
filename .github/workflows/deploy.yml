name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        working-directory: ./Frontend
        run: |
          npm install
          npm run build

      - name: Regenerate Prerendered Static Snapshot
        run: |
          node scripts/prerender.js

      - name: Sync Frontend Build into dist/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./Frontend/dist/
          server-dir: ./dist/  # Uploads build directly into your server's dist directory

      - name: Sync Prerendered Snapshot to Server Utils
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./backend/utils/
          server-dir: ./utils/